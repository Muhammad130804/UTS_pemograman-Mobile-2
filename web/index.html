<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>My Digital CV — Rafly M Ubaidillah</title>
    <meta name="description" content="Personal CV & Portfolio - Rafly M Ubaidillah" />

    <style>
      /* ============================================
         CSS PRINT — Hanya tampilan kertas CV
         Tersembunyi: header, tombol, form kontak
         Tampil: konten profil, skill, pendidikan, proyek
      ============================================ */
      @media print {
        /* Reset dasar */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }

        /* Ukuran kertas A4 */
        @page {
          size: A4 portrait;
          margin: 15mm 12mm 15mm 12mm;
        }

        /* Background putih bersih */
        html, body {
          background: white !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        /* Sembunyikan elemen bertag data-print="hide" */
        [data-print="hide"] {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          overflow: hidden !important;
        }

        /* Hindari page-break di dalam kartu */
        [data-print="card"],
        div[class*="subCard"],
        div[class*="mainCard"] {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        /* Hapus semua shadow & animasi */
        * {
          box-shadow: none !important;
          text-shadow: none !important;
          animation: none !important;
          transition: none !important;
        }

        /* Pastikan teks hitam & mudah dibaca */
        body, p, span, div {
          color: #1e1b4b !important;
        }
      }

      /* Styling body default web */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #root {
        display: flex;
        flex: 1;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
